<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulación Circuito RC en Serie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { background: #0b0f1a; font-family: 'Inter', system-ui, sans-serif; margin: 0; color: #eef2ff; overflow-x: hidden; }
    
    .app-container { 
      display: flex; 
      flex-direction: column; 
      width: 100vw; 
      padding: 8px; 
      gap: 10px; 
      box-sizing: border-box; 
    }
    
    @media (min-width: 1024px) {
      body { overflow: hidden; }
      .app-container { flex-direction: row; height: 100vh; padding: 12px; gap: 12px; }
      .left-panel { flex: 1.2; height: 100%; }
      .right-panel { flex: 1; height: 100%; overflow-y: auto; }
    }

    .left-panel, .right-panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .card { background: rgba(20, 28, 45, 0.9); backdrop-filter: blur(8px); border: 1px solid #2a3a5a; border-radius: 16px; padding: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
    
    .palette-item { background: #1e2b42; border-radius: 30px; padding: 6px 12px; font-size: 0.75rem; font-weight: 600; color: #b7d0ff; border: 1px solid #3a506e; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 4px; touch-action: manipulation; }
    .palette-item:hover { background: #2b3f5e; border-color: #5e8aff; color: white; }
    
    .btn { background: #1e2b42; border: 1px solid #3a506e; color: #d7e4ff; padding: 6px 10px; border-radius: 20px; font-weight: 600; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; touch-action: manipulation; }
    .btn:hover { background: #2b3f5e; border-color: #5e8aff; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; color: white; }
    .btn-danger { background: #b91c1c; border-color: #ef4444; color: white; }
    .btn-success { background: #047857; border-color: #10b981; color: white; }
    .btn-warning { background: #b45309; border-color: #d97706; color: white; }
    
    .canvas-wrapper { 
      position: relative; 
      background: #101624; 
      border-radius: 16px; 
      border: 1px solid #2e3f60; 
      overflow: hidden; 
      height: 240px; 
      width: 100%;
      touch-action: none; 
    }
    @media (min-width: 1024px) {
      .canvas-wrapper { flex: 1; height: auto; min-height: 240px; }
    }
    
    canvas#circuitCanvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
    
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    @media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
    
    .stat-item { background: #0d1422; border-radius: 10px; padding: 6px 10px; border-left: 3px solid #3b82f6; }
    .stat-label { font-size: 0.65rem; text-transform: uppercase; color: #8b9dc0; letter-spacing: 0.05em; }
    .stat-value { font-size: 0.85rem; font-weight: 700; font-family: monospace; color: #b9d2ff; }
    
    .chart-box { background: #0d1422; border-radius: 12px; padding: 10px; height: 170px; position: relative; }
    .formula-badge { position: absolute; top: 6px; right: 10px; background: #1e2b42; padding: 2px 8px; border-radius: 12px; font-size: 0.6rem; font-family: monospace; color: #9bb9ff; border: 1px solid #2b4160; z-index: 10; }
    
    input[type="number"] { background: #0d1422; border: 1px solid #2c3f5e; border-radius: 12px; padding: 4px 6px; color: white; font-size: 0.75rem; outline: none; width: 70px; }
    input[type="number"]:focus { border-color: #3b82f6; }
    
    .switch-group { display: flex; background: #0d1422; padding: 2px; border-radius: 30px; border: 1px solid #2b3f5e; }
    .switch-btn { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; border: none; background: transparent; color: #8b9dc0; cursor: pointer; }
    .switch-btn.active { background: #2563eb; color: white; }
    
    .time-btn { background: transparent; border: none; color: #8b9dc0; font-size: 0.7rem; cursor: pointer; padding: 3px 6px; border-radius: 8px; }
    .time-btn.active { background: #2563eb; color: white; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f1a; }
    ::-webkit-scrollbar-thumb { background: #2c3f5e; border-radius: 10px; }
  </style>
</head>
<body>
<div class="app-container">
  <!-- PANEL IZQUIERDO -->
  <div class="left-panel">

    <div class="card flex flex-col justify-center py-2 px-4 border-l-4 border-l-blue-500">
      <h1 class="text-sm sm:text-base font-bold text-sky-400 tracking-wide uppercase">⚡ Simulación Circuito RC en Serie</h1>
      <p class="text-xs text-slate-400"><strong>Autores:</strong> Tu Nombre 1, Tu Nombre 2, Tu Nombre 3</p>
    </div>

    <!-- BOTONES DE COMPONENTES -->
    <div class="card flex flex-wrap gap-1.5 items-center justify-between sm:justify-start">
      <button class="palette-item" onclick="addFromButton('source')">➕ 🔋 Fuente</button>
      <button class="palette-item" onclick="addFromButton('resistor')">➕ ⚡ Resistencia</button>
      <button class="palette-item" onclick="addFromButton('capacitor')">➕ 🔘 Capacitor</button>
      <button class="palette-item" onclick="addFromButton('switch')">➕ 🔄 Interruptor</button>
      <div class="w-full sm:w-auto sm:ml-auto flex gap-1 mt-1 sm:mt-0 justify-end">
        <button class="btn btn-primary text-xs" onclick="setPreset('guia')">🎯 Guía 8</button>
        <button class="btn btn-warning text-xs" onclick="setPreset('desfibrilador')">⚡ Desfibrilador</button>
      </div>
    </div>

    <!-- CONTROLES PRINCIPALES -->
    <div class="card flex flex-wrap items-center justify-between gap-2">
      <div class="flex gap-1.5">
        <button class="btn btn-danger" id="clearBtn">🗑️ Limpiar</button>
        <button class="btn" id="resetBtn">🔄 Reiniciar</button>
        <button class="btn" id="csvBtn">📥 CSV</button>
      </div>
      <div class="flex gap-1 items-center">
        <span class="text-xs text-slate-400 mr-0.5">Vel:</span>
        <button class="time-btn" data-speed="0.001">0.001x</button>
        <button class="time-btn" data-speed="0.1">0.1x</button>
        <button class="time-btn active" data-speed="1">1x</button>
        <button class="time-btn" data-speed="10">10x</button>
        <button class="time-btn" data-speed="60">60x</button>
      </div>
      <button class="btn btn-success" id="playBtn">▶ Iniciar</button>
    </div>

    <!-- CANVAS DEL CIRCUITO -->
    <div class="canvas-wrapper">
      <canvas id="circuitCanvas"></canvas>
    </div>

    <!-- CONFIGURACIÓN DE PARÁMETROS -->
    <div class="card flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center gap-1.5">
        <span class="text-xs text-slate-400">Switch:</span>
        <div class="switch-group">
          <button class="switch-btn active" id="btnStateCharge" data-state="charge">Carga</button>
          <button class="switch-btn" id="btnStateDischarge" data-state="discharge">Descarga</button>
          <button class="switch-btn" id="btnStateOpen" data-state="open">Abierto</button>
        </div>
      </div>
      <div class="flex items-center gap-1 flex-wrap">
        <span class="text-xs text-slate-400">R:</span>
        <input type="number" id="inR" value="470000" step="1000"><span class="text-xs text-slate-400">Ω</span>
        <span class="text-xs text-slate-400 ml-1">C:</span>
        <input type="number" id="inC" value="220" step="10"><span class="text-xs text-slate-400">µF</span>
        <span class="text-xs text-slate-400 ml-1">V₀:</span>
        <input type="number" id="inV" value="10" step="1"><span class="text-xs text-slate-400">V</span>
      </div>
    </div>

    <!-- METRICAS -->
    <div class="card stat-grid">
      <div class="stat-item"><div class="stat-label">V<sub>C</sub></div><div class="stat-value" id="valVc">0.00 V</div></div>
      <div class="stat-item"><div class="stat-label">I</div><div class="stat-value" id="valI">0.00 mA</div></div>
      <div class="stat-item"><div class="stat-label">Q</div><div class="stat-value" id="valQ">0.00 µC</div></div>
      <div class="stat-item"><div class="stat-label">E</div><div class="stat-value" id="valE">0.00 mJ</div></div>
      <div class="stat-item"><div class="stat-label">&tau; (Tau)</div><div class="stat-value" id="valTau">0.00 s</div></div>
      <div class="stat-item"><div class="stat-label">t (Tiempo)</div><div class="stat-value" id="valT">0.0 s (0.00 min)</div></div>
    </div>
    <div class="card text-center text-xs text-slate-400" id="analysisText">
      Cargando simulador...
    </div>
  </div>

  <!-- PANEL DERECHO CON LAS 4 GRÁFICAS -->
  <div class="right-panel">
    <div class="chart-box">
      <div class="formula-badge" id="fVc">V(t) = V₀(1 - e^(-t/τ))</div>
      <canvas id="chartVc"></canvas>
    </div>
    <div class="chart-box">
      <div class="formula-badge" id="fI">I(t) = (V₀/R)e^(-t/τ)</div>
      <canvas id="chartI"></canvas>
    </div>
    <div class="chart-box">
      <div class="formula-badge" id="fE">E(t) = ½ C V<sub>C</sub>²</div>
      <canvas id="chartE"></canvas>
    </div>
    <div class="chart-box">
      <div class="formula-badge" id="fLog">ln(V<sub>C</sub>) vs t</div>
      <canvas id="chartLog"></canvas>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('circuitCanvas');
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0;
  let isInitialized = false;

  function resizeCanvas() {
    const wrapper = canvas.parentElement;
    width = wrapper.clientWidth;
    height = wrapper.clientHeight;
    canvas.width = width;
    canvas.height = height;

    if (!isInitialized && width > 0 && height > 0) {
      initDefaultComponents();
      isInitialized = true;
    } else {
      draw();
    }
  }
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 100);

  let components = []; 
  let connections = []; 
  
  let sim = {
    t: 0, vc: 0, i: 0, q: 0, e: 0,
    tau: 103.4, r: 470000, c: 220e-6, v0: 10,
    switchState: 'charge', running: false, speed: 1,
    anchor_t: 0,       
    anchor_vc: 0,      
    last_real_time: 0
  };

  let historyVc = [];
  let historyI = [];
  let historyE = [];
  let historyLog = [];

  const createChartConfig = (titleText, yLabel, color, dataRef) => ({
    type: 'scatter',
    data: { datasets: [{ showLine: true, data: dataRef, borderColor: color, borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: color + '15' }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { 
        legend: { display: false },
        title: { display: true, text: titleText, color: '#eef2ff', font: { size: 10, weight: 'bold' }, align: 'start' }
      },
      scales: {
        x: { 
          type: 'linear', position: 'bottom',
          title: { display: true, text: 'Tiempo t (s)', color: '#8b9dc0', font: { size: 9, weight: 'bold' } },
          grid: { color: '#1a2338' }, 
          ticks: { color: '#8b9dc0', font: { size: 8 } }
        },
        y: { 
          title: { display: true, text: yLabel, color: '#8b9dc0', font: { size: 9, weight: 'bold' } },
          grid: { color: '#1a2338' }, 
          ticks: { color: '#8b9dc0', font: { size: 8 } } 
        }
      }
    }
  });

  const chartVc = new Chart(document.getElementById('chartVc'), createChartConfig('📈 Voltaje V_C(t)', 'Voltaje (V)', '#3b82f6', historyVc));
  chartVc.options.scales.y.min = 0;
  chartVc.options.scales.y.max = 11;

  const chartI = new Chart(document.getElementById('chartI'), createChartConfig('⚡ Corriente i(t)', 'Corriente (mA)', '#10b981', historyI));
  const chartE = new Chart(document.getElementById('chartE'), createChartConfig('🔋 Energía U(t)', 'Energía (mJ)', '#f59e0b', historyE));
  const chartLog = new Chart(document.getElementById('chartLog'), createChartConfig('📐 Linealización ln(V_C)', 'ln Variable', '#a855f7', historyLog));

  let selectedId = null;

  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.strokeStyle = '#1a2338'; ctx.lineWidth = 1;
    for (let i = 0; i < width; i += 25) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke(); }
    for (let i = 0; i < height; i += 25) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke(); }

    ctx.strokeStyle = '#5e8aff'; ctx.lineWidth = 3; ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 4;
    connections.forEach(conn => {
      const c1 = components.find(c => c.id === conn.fromId);
      const c2 = components.find(c => c.id === conn.toId);
      if (c1 && c2) {
        ctx.beginPath();
        ctx.moveTo(c1.x + c1.w/2, c1.y + c1.h/2);
        ctx.lineTo(c2.x + c2.w/2, c2.y + c2.h/2);
        ctx.stroke();
      }
    });
    ctx.shadowBlur = 0;

    components.forEach(c => {
      ctx.save();
      ctx.translate(c.x, c.y);
      if (selectedId === c.id) {
        ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2; ctx.strokeRect(-2, -2, c.w+4, c.h+4);
      }

      if (c.type === 'source') {
        ctx.beginPath(); ctx.arc(c.w/2, c.h/2, 16, 0, Math.PI*2);
        ctx.fillStyle = '#1e2b42'; ctx.fill();
        ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#b9d2ff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+', c.w/2 + 5, c.h/2 - 5); ctx.fillText('-', c.w/2 - 5, c.h/2 + 5);
        ctx.fillStyle = '#8b9dc0'; ctx.font = '8px sans-serif'; ctx.fillText(sim.v0 + 'V', c.w/2, c.h/2 + 22);
      } 
      else if (c.type === 'resistor') {
        ctx.fillStyle = '#1e2b42'; ctx.fillRect(0, 0, c.w, c.h);
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, c.w, c.h);
        ctx.beginPath(); ctx.moveTo(4, c.h/2);
        for (let i=0; i<5; i++) ctx.lineTo(4 + i*7 + 3, i%2===0 ? c.h/2 - 5 : c.h/2 + 5);
        ctx.lineTo(c.w - 4, c.h/2); ctx.stroke();
        ctx.fillStyle = '#8b9dc0'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText((sim.r/1000).toFixed(1) + 'kΩ', c.w/2, c.h + 10);
      } 
      else if (c.type === 'capacitor') {
        ctx.fillStyle = '#1e2b42'; ctx.fillRect(0, 0, c.w, c.h);
        ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, c.w, c.h);
        ctx.beginPath(); ctx.moveTo(c.w*0.35, 4); ctx.lineTo(c.w*0.35, c.h - 4);
        ctx.moveTo(c.w*0.65, 4); ctx.lineTo(c.w*0.65, c.h - 4); ctx.stroke();
        ctx.fillStyle = '#8b9dc0'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText((sim.c*1e6).toFixed(0) + 'µF', c.w/2, c.h + 10);
      } 
      else if (c.type === 'switch') {
        ctx.fillStyle = '#1e2b42'; ctx.fillRect(0, 0, c.w, c.h);
        ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, c.w, c.h);
        let color = sim.switchState === 'charge' ? '#10b981' : (sim.switchState === 'discharge' ? '#ef4444' : '#6b7280');
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(c.w/2, c.h/2, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8b9dc0'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(sim.switchState === 'charge' ? 'Carga' : (sim.switchState === 'discharge' ? 'Descarga' : 'Abierto'), c.w/2, c.h + 10);
      }
      ctx.restore();
    });

    if (components.length === 0) {
      ctx.fillStyle = '#4a5f80'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Pulsa los botones de arriba para añadir componentes', width/2, height/2);
    }
  }

  function addFromButton(type) {
    let w = 45, h = 28;
    if (type === 'source') { w = 40; h = 40; }
    if (type === 'resistor') { w = 45; h = 24; }
    if (type === 'capacitor') { w = 40; h = 30; }
    if (type === 'switch') { w = 45; h = 28; }
    
    const x = Math.round(width / 2 - w / 2);
    const y = Math.round(height / 2 - h / 2);

    const newComp = { id: type + '_' + Date.now(), type, x, y, w, h };
    components.push(newComp);
    draw();
  }

  function setSwitchState(newState) {
    sim.switchState = newState;
    document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
    if (newState === 'charge') document.getElementById('btnStateCharge').classList.add('active');
    else if (newState === 'discharge') document.getElementById('btnStateDischarge').classList.add('active');
    else if (newState === 'open') document.getElementById('btnStateOpen').classList.add('active');
    
    setAnchor();
    draw();
    if (!sim.running) startSim();
  }

  let draggingComp = null, offsetX = 0, offsetY = 0;

  function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function handlePointerDown(clientX, clientY) {
    const { x: mx, y: my } = getCanvasCoords(clientX, clientY);
    let clickedComp = components.find(c => mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h);
    
    if (clickedComp) {
      if (clickedComp.type === 'switch') {
        const nextState = sim.switchState === 'charge' ? 'discharge' : (sim.switchState === 'discharge' ? 'open' : 'charge');
        setSwitchState(nextState);
      }

      draggingComp = clickedComp;
      offsetX = mx - clickedComp.x;
      offsetY = my - clickedComp.y;

      if (selectedId === null) selectedId = clickedComp.id;
      else if (selectedId === clickedComp.id) selectedId = null;
      else {
        const exists = connections.find(c => (c.fromId === selectedId && c.toId === clickedComp.id) || (c.fromId === clickedComp.id && c.toId === selectedId));
        if (!exists) connections.push({ fromId: selectedId, toId: clickedComp.id });
        selectedId = null;
      }
    } else {
      selectedId = null;
    }
    draw();
  }

  function handlePointerMove(clientX, clientY) {
    if (draggingComp) {
      const { x: mx, y: my } = getCanvasCoords(clientX, clientY);
      draggingComp.x = Math.max(0, Math.min(mx - offsetX, width - draggingComp.w));
      draggingComp.y = Math.max(0, Math.min(my - offsetY, height - draggingComp.h));
      draw();
    }
  }

  canvas.addEventListener('mousedown', e => handlePointerDown(e.clientX, e.clientY));
  canvas.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', () => { draggingComp = null; });

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, {passive: true});

  canvas.addEventListener('touchmove', e => {
    if (draggingComp && e.touches.length === 1) {
      e.preventDefault(); 
      handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, {passive: false});

  window.addEventListener('touchend', () => { draggingComp = null; });

  canvas.addEventListener('dblclick', e => {
    const { x: mx, y: my } = getCanvasCoords(e.clientX, e.clientY);
    for (let i = components.length - 1; i >= 0; i--) {
      const c = components[i];
      if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) {
        connections = connections.filter(conn => conn.fromId !== c.id && conn.toId !== c.id);
        components.splice(i, 1);
        draw(); break;
      }
    }
  });

  function setAnchor() {
    sim.anchor_t = sim.t;
    sim.anchor_vc = sim.vc;
    sim.last_real_time = performance.now();
  }

  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');

  function startSim() {
    if (!sim.running) {
      sim.running = true;
      playBtn.textContent = '⏸ Pausar';
      playBtn.className = 'btn btn-warning';
      setAnchor();
      requestAnimationFrame(loop);
    }
  }

  function pauseSim(customText = '▶ Reanudar') {
    sim.running = false;
    playBtn.textContent = customText;
    playBtn.className = 'btn btn-success';
  }

  playBtn.addEventListener('click', () => {
    if (sim.running) pauseSim('▶ Reanudar');
    else startSim();
  });

  resetBtn.addEventListener('click', () => {
    sim.running = false;
    playBtn.textContent = '▶ Iniciar';
    playBtn.className = 'btn btn-success';
    sim.t = 0; sim.vc = 0; sim.i = 0; sim.q = 0; sim.e = 0;
    
    historyVc.length = 0; historyI.length = 0; historyE.length = 0; historyLog.length = 0;

    historyVc.push({ x: 0, y: 0 });
    historyI.push({ x: 0, y: (sim.v0 / sim.r) * 1000 });
    historyE.push({ x: 0, y: 0 });

    setAnchor();
    updateCharts(); updateReadings(); draw();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if(confirm('¿Borrar todo el circuito?')) { components = []; connections = []; selectedId = null; draw(); }
  });

  document.getElementById('csvBtn').addEventListener('click', () => {
    if (historyVc.length === 0) return alert('No hay datos para exportar.');
    let csv = "t(s),t(min),Vc(V),I(mA),E(mJ),ln(Vc)\n";
    for (let i = 0; i < historyVc.length; i++) {
      const logVal = historyLog[i] ? historyLog[i].y.toFixed(4) : '';
      csv += `${historyVc[i].x.toFixed(3)},${(historyVc[i].x/60).toFixed(3)},${historyVc[i].y.toFixed(3)},${historyI[i].y.toFixed(3)},${historyE[i].y.toFixed(3)},${logVal}\n`;
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'datos_rc.csv'; a.click();
  });

  document.querySelectorAll('.switch-btn').forEach(btn => {
    btn.addEventListener('click', () => { setSwitchState(btn.dataset.state); });
  });

  document.querySelectorAll('.time-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setAnchor();
      sim.speed = parseFloat(btn.dataset.speed);
    });
  });

  document.getElementById('inR').addEventListener('input', e => { sim.r = parseFloat(e.target.value) || 1000; sim.tau = sim.r * sim.c; draw(); updateReadings(); });
  document.getElementById('inC').addEventListener('input', e => { sim.c = (parseFloat(e.target.value) || 1000) * 1e-6; sim.tau = sim.r * sim.c; draw(); updateReadings(); });
  document.getElementById('inV').addEventListener('input', e => { 
    sim.v0 = parseFloat(e.target.value) || 10; 
    chartVc.options.scales.y.max = sim.v0 * 1.1;
    draw(); updateReadings();
  });

  window.setPreset = function(type) {
    if (type === 'guia') {
      document.getElementById('inR').value = 470000; document.getElementById('inC').value = 220; document.getElementById('inV').value = 10;
      sim.r = 470000; sim.c = 220e-6; sim.v0 = 10; sim.speed = 1;
    } else if (type === 'desfibrilador') {
      document.getElementById('inR').value = 60; document.getElementById('inC').value = 100; document.getElementById('inV').value = 3000;
      sim.r = 60; sim.c = 100e-6; sim.v0 = 3000; sim.speed = 0.001;
    }
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.time-btn[data-speed="${sim.speed}"]`)?.classList.add('active');
    sim.tau = sim.r * sim.c;
    resetBtn.click();
  };

  function loop() {
    if (!sim.running) return;

    const now = performance.now();
    const dt_real = (now - sim.last_real_time) / 1000;
    sim.last_real_time = now;
    
    const dt_sim = dt_real * sim.speed;
    sim.t += dt_sim;
    sim.tau = sim.r * sim.c;

    const dt_from_anchor = sim.t - sim.anchor_t;
    let autoFinish = false;

    if (sim.switchState === 'charge') {
      sim.vc = sim.v0 - (sim.v0 - sim.anchor_vc) * Math.exp(-dt_from_anchor / sim.tau);
      sim.i = (sim.v0 - sim.vc) / sim.r;

      if (dt_from_anchor >= 10 * sim.tau) {
        sim.vc = sim.v0;
        sim.i = 0;
        autoFinish = true;
      }
    } 
    else if (sim.switchState === 'discharge') {
      sim.vc = sim.anchor_vc * Math.exp(-dt_from_anchor / sim.tau);
      sim.i = -(sim.vc / sim.r);

      if (dt_from_anchor >= 10 * sim.tau) {
        sim.vc = 0;
        sim.i = 0;
        autoFinish = true;
      }
    } 
    else {
      sim.vc = sim.anchor_vc;
      sim.i = 0;
    }

    sim.q = sim.c * sim.vc;
    sim.e = 0.5 * sim.c * Math.pow(sim.vc, 2);

    let logVal = null;
    if (sim.switchState === 'discharge' && sim.vc > 0.001) {
      logVal = Math.log(sim.vc);
    } else if (sim.switchState === 'charge' && (sim.v0 - sim.vc) > 0.001) {
      logVal = Math.log(1 - (sim.vc / sim.v0));
    }

    historyVc.push({ x: sim.t, y: sim.vc });
    historyI.push({ x: sim.t, y: sim.i * 1000 });
    historyE.push({ x: sim.t, y: sim.e * 1000 });
    if (logVal !== null) {
      historyLog.push({ x: sim.t, y: logVal });
    }

    updateReadings();
    updateCharts();
    draw();

    if (autoFinish) {
      pauseSim('✅ Completado (10τ)');
    } else if (sim.running) {
      requestAnimationFrame(loop);
    }
  }

  function updateReadings() {
    const tMin = sim.t / 60;
    const tauMin = sim.tau / 60;

    document.getElementById('valVc').textContent = sim.vc.toFixed(2) + ' V';
    document.getElementById('valI').textContent = (sim.i * 1000).toFixed(2) + ' mA';
    document.getElementById('valQ').textContent = (sim.q * 1e6).toFixed(2) + ' µC';
    document.getElementById('valE').textContent = (sim.e * 1000).toFixed(2) + ' mJ';
    
    document.getElementById('valTau').textContent = `${sim.tau.toFixed(2)} s (${tauMin.toFixed(2)} min)`;
    document.getElementById('valT').textContent = `${sim.t.toFixed(1)} s (${tMin.toFixed(2)} min)`;

    document.getElementById('fVc').textContent = `V(t) = ${sim.v0}V · (1 - e^(-t/${sim.tau.toFixed(1)}s))`;
    document.getElementById('fI').textContent = `I(t) = ${(sim.v0/sim.r*1000).toFixed(2)}mA · e^(-t/${sim.tau.toFixed(1)}s)`;
    document.getElementById('fE').textContent = `E(t) = ½ · ${(sim.c*1e6).toFixed(0)}µF · V_C²`;

    if (sim.switchState === 'discharge') {
      document.getElementById('fLog').textContent = `ln(V_C) = -t/${sim.tau.toFixed(1)} + ln(V_i)`;
    } else {
      document.getElementById('fLog').textContent = `ln(1 - V_C/V_0) = -t/${sim.tau.toFixed(1)}`;
    }

    document.getElementById('analysisText').innerHTML = 
      `<strong>Constante τ:</strong> ${sim.tau.toFixed(2)}s (${tauMin.toFixed(2)} min) | <strong>Proceso completo (10τ):</strong> ${(sim.tau * 10).toFixed(1)}s (${(tauMin * 10).toFixed(2)} min)`;
  }

  function updateCharts() {
    chartVc.update('none');
    chartI.update('none');
    chartE.update('none');
    chartLog.update('none');
  }

  function initDefaultComponents() {
    components = [];
    connections = [];

    const wS = 40, hS = 40;
    const wR = 45, hR = 24;
    const wC = 40, hC = 30;
    const wSw = 45, hSw = 28;

    const sourceX = Math.round(width * 0.1);
    const sourceY = Math.round(height * 0.4);

    const resistorX = Math.round(width * 0.42);
    const resistorY = Math.round(height * 0.15);

    const capacitorX = Math.round(width * 0.72);
    const capacitorY = Math.round(height * 0.4);

    const switchX = Math.round(width * 0.42);
    const switchY = Math.round(height * 0.65);

    components.push({ id: 'source_' + Date.now(), type: 'source', x: sourceX, y: sourceY, w: wS, h: hS });
    components.push({ id: 'resistor_' + Date.now(), type: 'resistor', x: resistorX, y: resistorY, w: wR, h: hR });
    components.push({ id: 'capacitor_' + Date.now(), type: 'capacitor', x: capacitorX, y: capacitorY, w: wC, h: hC });
    components.push({ id: 'switch_' + Date.now(), type: 'switch', x: switchX, y: switchY, w: wSw, h: hSw });

    for(let i = 0; i < components.length - 1; i++) {
      connections.push({ fromId: components[i].id, toId: components[i+1].id });
    }
    connections.push({ fromId: components[components.length-1].id, toId: components[0].id });

    sim.tau = sim.r * sim.c;
    
    historyVc.push({ x: 0, y: 0 });
    historyI.push({ x: 0, y: (sim.v0 / sim.r) * 1000 });
    historyE.push({ x: 0, y: 0 });

    draw();
    updateReadings();
    setAnchor();
  }
</script>
</body>
</html>
